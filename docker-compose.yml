version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: blog_nginx
    ports:
      - "8088:80"
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - blog_net

  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: blog_php
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: blog_db
      DB_USER: blog_user
      DB_PASSWORD: blog_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    networks:
      - blog_net

  mysql:
    image: mysql:8.0
    container_name: blog_mysql
    restart: always
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: blog_db
      MYSQL_USER: blog_user
      MYSQL_PASSWORD: blog_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - blog_net

  redis:
    image: redis:7-alpine
    container_name: blog_redis
    restart: always
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    networks:
      - blog_net

volumes:
  db_data:
  redis_data:

networks:
  blog_net:
    driver: bridge
